<!doctype html><meta charset="utf-8" /><link rel="stylesheet" href="base.css" /><link
  rel="stylesheet"
  href="stage.css"
/>
<style>
  .app {
    width: 1180px;
    height: 760px;
    left: 300px;
    top: 150px;
    transform: perspective(2600px) rotateX(14deg) rotateY(16deg) rotateZ(-3deg);
    transform-origin: 60% 50%;
  }
  .app iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  .vid {
    position: absolute;
    width: 190px;
    height: 330px;
    border-radius: 26px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px #ffffff22,
      0 40px 80px -20px #000;
  }
  .vid .bg {
    position: absolute;
    inset: 0;
  }
  .vid .meta {
    z-index: 1;
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 14px;
  }
  .vid b {
    display: block;
    font-size: 15px;
  }
  .vid small {
    font-size: 12px;
    color: #ffffffcc;
  }
  .vid .v {
    position: absolute;
    top: 14px;
    left: 14px;
    padding: 5px 10px;
    border-radius: 999px;
    background: #0008;
    font-size: 12px;
    font-weight: 700;
    backdrop-filter: blur(6px);
  }
  .f1 {
    left: 70px;
    top: 700px;
    padding: 18px 20px;
    width: 290px;
  }
  .f1 small {
    color: #a29fb8;
    font-weight: 600;
  }
  .f1 strong {
    display: block;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1px;
    margin: 4px 0;
  }
  .f1 em {
    font-style: normal;
    color: #57e0a0;
    font-weight: 700;
    font-size: 13px;
  }
  .f2 {
    right: 90px;
    bottom: 70px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-radius: 16px;
  }
  .f2 .av {
    display: flex;
  }
  .f2 .av i {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid #15131f;
    margin-left: -8px;
  }
  .f2 b {
    font-size: 14px;
  }
  .f2 small {
    display: block;
    color: #a29fb8;
    font-size: 12px;
  }
</style>
<div class="stage">
  <div
    class="glow"
    style="width: 900px; height: 700px; left: -200px; top: -300px; background: #7b5cff; opacity: 0.45"
  ></div>
  <div
    class="glow"
    style="width: 800px; height: 600px; right: -200px; bottom: -260px; background: #ff4fb0; opacity: 0.35"
  ></div>
  <div class="grid"></div>
  <div class="win app"><iframe src="hitviro-app.html"></iframe></div>
  <div class="vid" style="left: 80px; top: 250px; rotate: -8deg">
    <div
      class="bg"
      style="
        background:
          radial-gradient(60% 40% at 60% 35%, #ff9bd6, transparent),
          linear-gradient(180deg, #5a2fd0, #ff7ad1 70%, #1a0f33);
      "
    ></div>
    <svg
      viewBox="0 0 190 330"
      preserveAspectRatio="none"
      style="position: absolute; inset: 0; width: 100%; height: 100%"
    >
      <circle cx="120" cy="120" r="34" fill="#fff3" />
      <path
        d="M0 330V240h18v-30h16v40h14v-60h20v70h12v-40h18v55h16v-80h22v90h14v-35h20v-20h20V330Z"
        fill="#0b0716cc"
      />
      <path d="M0 330V270h24v-14h20v30h30v-24h26v36h22v-18h30v-10h18v30h20V330Z" fill="#05030b" /></svg
    ><span class="v">▶ 1,4 млн</span>
    <div class="meta"><b>@neon.edits</b><small>Luz de Neón · 0:15</small></div>
  </div>
  <div class="vid" style="left: 1290px; top: 110px; rotate: 7deg; width: 170px; height: 300px">
    <div
      class="bg"
      style="
        background:
          radial-gradient(50% 35% at 45% 38%, #ffd27a, transparent),
          linear-gradient(180deg, #2a0f3a, #e0453a 65%, #2a0f1a);
      "
    ></div>
    <svg
      viewBox="0 0 190 330"
      preserveAspectRatio="none"
      style="position: absolute; inset: 0; width: 100%; height: 100%"
    >
      <circle cx="120" cy="120" r="34" fill="#fff3" />
      <path
        d="M0 330V240h18v-30h16v40h14v-60h20v70h12v-40h18v55h16v-80h22v90h14v-35h20v-20h20V330Z"
        fill="#0b0716cc"
      />
      <path d="M0 330V270h24v-14h20v30h30v-24h26v36h22v-18h30v-10h18v30h20V330Z" fill="#05030b" /></svg
    ><span class="v">▶ 864 тыс.</span>
    <div class="meta"><b>@drive.mood</b><small>Night Drive · 0:12</small></div>
  </div>
  <div class="float f1">
    <small>Просмотры кампании</small><strong>+1,2 млн</strong><em>за последние 7 дней</em>
    <svg width="250" height="56" style="margin-top: 10px">
      <defs>
        <linearGradient id="h" x1="0" x2="1">
          <stop offset="0" stop-color="#a79bff" />
          <stop offset="1" stop-color="#ff7ad1" />
        </linearGradient>
      </defs>
      <path
        d="M0 48 C30 44 45 36 70 38 S110 22 140 26 S190 8 250 4"
        fill="none"
        stroke="url(#h)"
        stroke-width="3"
        stroke-linecap="round"
      />
    </svg>
  </div>
  <div class="float f2">
    <span class="av"
      ><i style="background: linear-gradient(135deg, #ffb36b, #ff4f8b); margin-left: 0"></i
      ><i style="background: linear-gradient(135deg, #7ee0b0, #2f6bff)"></i
      ><i style="background: linear-gradient(135deg, #c48bff, #5a2fd0)"></i></span
    ><span><b>38 авторов в подборке</b><small>одобрите — и ролики выйдут</small></span>
  </div>
</div>
