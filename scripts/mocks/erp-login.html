<!doctype html><meta charset="utf-8" /><link rel="stylesheet" href="base.css" /><link
  rel="stylesheet"
  href="stage.css"
/>
<style>
  /* фон: «призма» из вертикальных световых полос */
  .prism {
    position: absolute;
    inset: -10%;
    background:
      repeating-linear-gradient(
        90deg,
        #0000 0 22px,
        #ffffff10 22px 23px,
        #0000 23px 61px,
        #9fb4ff22 61px 63px,
        #0000 63px 97px,
        #ffd7a822 97px 99px,
        #0000 99px 140px
      ),
      linear-gradient(90deg, #06080f, #141a36 30%, #2a1f4a 50%, #141a36 70%, #06080f);
    -webkit-mask-image: radial-gradient(60% 80% at 50% 50%, #000 30%, transparent 80%);
    mask-image: radial-gradient(60% 80% at 50% 50%, #000 30%, transparent 80%);
  }
  .card {
    position: absolute;
    left: 50%;
    top: 50%;
    translate: -50% -50%;
    width: 1180px;
    height: 720px;
    border-radius: 30px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 500px 1fr;
    box-shadow:
      0 0 0 1px #ffffff1c,
      0 1px 0 #ffffff30 inset,
      0 80px 160px -30px #000,
      0 0 120px -30px #6f7dff88;
  }
  .l {
    background: linear-gradient(180deg, #11131c, #0c0e15);
    padding: 56px 54px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.4px;
  }
  .brand i {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: conic-gradient(from 200deg, #2f6bff, #8a5cff, #2fd3ff, #2f6bff);
    box-shadow: 0 0 30px #2f6bffaa;
  }
  h1 {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -1.4px;
    margin-top: 68px;
    line-height: 1.05;
  }
  p {
    color: #8088a2;
    font-size: 16.5px;
    line-height: 1.55;
    margin: 12px 0 34px;
  }
  label {
    font-weight: 600;
    font-size: 13.5px;
    color: #aeb5ca;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  label a {
    color: #7d9dff;
  }
  .in {
    height: 54px;
    border-radius: 14px;
    background: #161a26;
    border: 1px solid #232a3d;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    font-size: 16px;
    margin-bottom: 20px;
    color: #e8ebf4;
  }
  .in.f {
    border-color: #4d7bff;
    box-shadow: 0 0 0 4px #4d7bff26;
  }
  .in .ic {
    color: #6c7590;
  }
  .go {
    margin-top: 8px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(180deg, #4b7dff, #2554f0);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 17px;
    box-shadow:
      0 1px 0 #ffffff55 inset,
      0 16px 30px -12px #2f6bff;
  }
  .or {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #5d6580;
    font-size: 13px;
    margin: 22px 0;
  }
  .or::before,
  .or::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #1f2536;
  }
  .lang {
    margin-top: auto;
    display: flex;
    gap: 6px;
  }
  .lang span {
    padding: 6px 12px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 700;
    color: #7b84a0;
    border: 1px solid #1f2536;
  }
  .lang .on {
    color: #fff;
    background: #1c2236;
    border-color: #2c3552;
  }
  .r {
    position: relative;
    background: #05060a;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
  }
  .r svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .r::after {
    content: '';
    position: absolute;
    inset: auto 0 0 0;
    height: 55%;
    background: linear-gradient(transparent, #05060aee 70%);
  }
  .q {
    z-index: 1;
    position: absolute;
    left: 56px;
    bottom: 52px;
    right: 56px;
  }
  .q b {
    display: block;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.8px;
    line-height: 1.15;
  }
  .q small {
    display: block;
    color: #a7adc2;
    margin-top: 12px;
    font-size: 14px;
  }
  .chip {
    position: absolute;
    right: 40px;
    top: 40px;
    padding: 8px 14px;
    border-radius: 999px;
    background: #05060a99;
    border: 1px solid #ffffff24;
    font-size: 13px;
    font-weight: 600;
    backdrop-filter: blur(8px);
  }
</style>
<div class="stage">
  <div class="prism"></div>
  <div
    class="glow"
    style="
      width: 700px;
      height: 500px;
      left: 50%;
      top: 50%;
      translate: -50% -50%;
      background: #3b4cff;
      opacity: 0.25;
    "
  ></div>
  <div class="card">
    <div class="l">
      <div class="brand"><i></i>0to8 ERP</div>
      <h1>С возвращением</h1>
      <p>Войдите по почте или логину, чтобы открыть рабочее пространство лейбла.</p>
      <label>Email или логин</label>
      <div class="in f">
        <svg class="ic" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="3" />
          <path d="M3 7l9 6 9-6" /></svg
        >manager@label.demo
      </div>
      <label>Пароль <a>Забыли?</a></label>
      <div class="in">
        <svg class="ic" viewBox="0 0 24 24">
          <rect x="4" y="10" width="16" height="11" rx="3" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
        ><span style="letter-spacing: 5px">••••••••••</span>
      </div>
      <div class="go">Войти</div>
      <div class="lang"><span class="on">RU</span><span>EN</span><span>PT</span><span>ES</span></div>
    </div>
    <div class="r">
      <svg viewBox="0 0 680 720" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b0d14" />
            <stop offset=".38" stop-color="#3a4060" />
            <stop offset=".5" stop-color="#e9edff" />
            <stop offset=".56" stop-color="#8f97c8" />
            <stop offset=".75" stop-color="#1b1f33" />
            <stop offset="1" stop-color="#05060a" />
          </linearGradient>
          <linearGradient id="c2" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#05060a" />
            <stop offset=".42" stop-color="#5b48c8" />
            <stop offset=".52" stop-color="#ffd2f0" />
            <stop offset=".6" stop-color="#7d6cff" />
            <stop offset="1" stop-color="#05060a" />
          </linearGradient>
          <linearGradient id="c3" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#05060a" />
            <stop offset=".45" stop-color="#1f5bff" />
            <stop offset=".55" stop-color="#bff0ff" />
            <stop offset=".65" stop-color="#2f6bff" />
            <stop offset="1" stop-color="#05060a" />
          </linearGradient>
          <filter id="s"><feGaussianBlur stdDeviation="3" /></filter>
        </defs>
        <path
          d="M-60 300 C120 120 340 80 760 -40 L760 120 C460 170 220 260 -60 470Z"
          fill="url(#c1)"
          filter="url(#s)"
        />
        <path
          d="M-60 560 C160 380 420 330 760 200 L760 360 C470 420 260 520 -60 720Z"
          fill="url(#c2)"
          filter="url(#s)"
        />
        <path
          d="M120 780 C300 620 500 560 760 470 L760 640 C560 680 420 740 320 780Z"
          fill="url(#c3)"
          filter="url(#s)"
        />
      </svg>
      <span class="chip">Zero to Infinity · внутренняя система</span>
      <div class="q">
        <b>Релизы, сплиты и стримы — в одном месте.</b
        ><small>Дистрибуция, саппорт, документы и маркетинг лейбла</small>
      </div>
    </div>
  </div>
</div>
