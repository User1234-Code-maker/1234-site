<!-- рамка телефона: ?s=путь к картинке экрана -->
<!doctype html><meta charset="utf-8" /><link rel="stylesheet" href="base.css" /><link
  rel="stylesheet"
  href="stage.css"
/>
<style>
  body {
    background: transparent;
  }
  .ph {
    position: absolute;
    left: 20px;
    top: 20px;
    width: 430px;
    height: 900px;
    border-radius: 66px;
    padding: 14px;
    background: linear-gradient(145deg, #3a3f4d, #14161c 40%, #2a2e38 70%, #0d0e12);
    box-shadow:
      0 0 0 1.5px #5a6070 inset,
      0 0 0 1px #000;
  }
  .sc {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 53px;
    overflow: hidden;
    background: #000;
  }
  .sc img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .isl {
    position: absolute;
    left: 50%;
    top: 12px;
    translate: -50% 0;
    width: 118px;
    height: 34px;
    border-radius: 20px;
    background: #000;
  }
  .sb {
    position: absolute;
    left: 34px;
    right: 30px;
    top: 17px;
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
  }
  .sb span:last-child {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .bat {
    width: 24px;
    height: 12px;
    border: 1.5px solid #fffa;
    border-radius: 4px;
    padding: 1.5px;
  }
  .bat i {
    display: block;
    width: 70%;
    height: 100%;
    background: #fff;
    border-radius: 1.5px;
  }
  .hb {
    position: absolute;
    left: 50%;
    bottom: 9px;
    translate: -50% 0;
    width: 134px;
    height: 5px;
    border-radius: 9px;
    background: #fffc;
  }
</style>
<div class="ph">
  <div class="sc">
    <img id="i" />
    <div class="isl"></div>
    <div class="sb">
      <span>9:41</span
      ><span
        >▂▄▆ <span class="bat"><i></i></span
      ></span>
    </div>
    <div class="hb"></div>
  </div>
</div>
<script>
  document.getElementById('i').src = new URLSearchParams(location.search).get('s')
</script>
