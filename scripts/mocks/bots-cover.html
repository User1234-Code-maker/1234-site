<!doctype html><meta charset="utf-8" /><link rel="stylesheet" href="base.css" /><link
  rel="stylesheet"
  href="stage.css"
/>
<style>
  .p {
    position: absolute;
    width: 470px;
    filter: drop-shadow(0 60px 60px #000c);
  }
  .chip {
    position: absolute;
    padding: 12px 16px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
  }
  .chip i {
    width: 30px;
    height: 30px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-style: normal;
  }
  .chip small {
    display: block;
    color: #8a93ad;
    font-weight: 600;
    font-size: 12px;
  }
</style>
<div class="stage">
  <div
    class="glow"
    style="
      width: 900px;
      height: 700px;
      left: 50%;
      top: -200px;
      translate: -50% 0;
      background: #2f6bff;
      opacity: 0.4;
    "
  ></div>
  <div
    class="glow"
    style="width: 700px; height: 500px; left: -150px; bottom: -200px; background: #14b8a6; opacity: 0.35"
  ></div>
  <div
    class="glow"
    style="width: 600px; height: 500px; right: -150px; bottom: -150px; background: #e0335f; opacity: 0.28"
  ></div>
  <div class="grid"></div>
  <img
    class="p"
    src="file:///tmp/framed-menu.png"
    style="left: 160px; top: 120px; transform: perspective(2000px) rotateY(22deg) rotateZ(-4deg) scale(0.86)"
  />
  <img
    class="p"
    src="file:///tmp/framed-review.png"
    style="right: 160px; top: 120px; transform: perspective(2000px) rotateY(-22deg) rotateZ(4deg) scale(0.86)"
  />
  <img class="p" src="file:///tmp/framed-radar.png" style="left: 565px; top: 40px; transform: scale(0.98)" />
  <div class="float chip" style="left: 90px; top: 760px">
    <i style="background: #3ee08f26; color: #3ee08f">♥</i
    ><span>Трек в шорт-лист<small>Night Drive · KAIRO</small></span>
  </div>
  <div class="float chip" style="right: 80px; top: 150px">
    <i style="background: #ffb54726; color: #ffb547">≋</i
    ><span>Ускорение на радаре<small>@nightcore.lab · 6 ч назад</small></span>
  </div>
</div>
