name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      # base = /<имя-репозитория>/, иначе стили и картинки не найдутся на github.io/<repo>/
      - name: Build
        run: npm run build
        env:
          # свой домен: в Settings → Secrets and variables → Actions → Variables задать CUSTOM_DOMAIN (например bogdankorzun.dev)
          VITE_BASE: ${{ vars.CUSTOM_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}
          SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || '' }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          # счётчик посещений без cookie (GoatCounter): переменная GOATCOUNTER = код счётчика
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
